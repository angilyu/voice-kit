[project]
name = "voice-kit"
version = "0.1.0"
description = "Reusable realtime voice-agent stack: LiveKit + LangGraph sessions, turn-taking presets, streaming text helpers and a Retell custom-LLM adapter"
readme = "README.md"
authors = [
    { name = "angilyu" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4",
    "langchain-core>=1.0",
    "pydantic>=2",
]

[project.optional-dependencies]
# LiveKit Agents worker helpers (voice_kit.livekit). Enhanced noise cancellation needs LiveKit Cloud.
livekit = [
    "livekit-agents[langchain]~=1.8",
    "livekit-plugins-noise-cancellation>=0.2",
]
# Token minting and agent dispatch for app backends (voice_kit.tokens); no agents runtime.
tokens = ["livekit-api>=1.0"]
# Retell custom-LLM websocket adapter and REST client (voice_kit.retell).
retell = ["httpx>=0.28", "starlette>=0.40"]
# Self-ping middleware for free hosts (voice_kit.keepalive).
server = ["httpx>=0.28", "starlette>=0.40"]
# OpenAI chat models through LangChain's init_chat_model.
openai = ["langchain[openai]>=1.4"]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "livekit-api>=1.0",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "starlette>=0.40",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
